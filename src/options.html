<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Tab Sorter options</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 16px; min-width: 320px; }
      label { display: block; margin-bottom: 12px; }
      select { display: block; margin-top: 4px; }
      #status { color: #2563eb; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <label>Sort by<select id="sortKey"></select></label>
    <label>Order<select id="order"></select></label>
    <label><input type="checkbox" id="allWindows"> Sort all windows, not just the current one</label>
    <label><input type="checkbox" id="sortOnStartup"> Sort all windows when the browser starts</label>
    <p id="status"></p>
    <script type="module" src="options.js"></script>
  </body>
</html>
